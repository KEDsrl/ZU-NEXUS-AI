image boot.vfat {
	vfat {
		file BOOT.BIN { image = "BOOT.BIN" }
		file Image { image = "Image" }
		file system.dtb { image = "zynqmp-ked-zcu-revA.dtb" }
		file extlinux/extlinux.conf { image = "extlinux.conf" }
	}
	size = 128M
}

image sdcard.img {
	hdimage {}
	partition boot {
		partition-type = 0xC
		bootable = "true"
		image = "boot.vfat"
	}
	partition rootfs {
		partition-type = 0x83
		image = "rootfs.ext4"
	}
}
