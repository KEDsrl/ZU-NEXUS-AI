# Il driver DRM xlnx (2023.2) rifiuta i commit atomici quando Weston tenta
# l'offload delle view sul piano video (vincolo layer full-size 1920x1080)
# e il rifiuto congela il repaint: schermo fermo e spam
# "Layer width:height must be 1920:1080" in dmesg.
# Con l'atomic disabilitato Weston usa il modesetting legacy, niente
# tentativi di offload, e il video via dmabuf viene composto in GL (lima).
[Service]
Environment=WESTON_DISABLE_ATOMIC=1
