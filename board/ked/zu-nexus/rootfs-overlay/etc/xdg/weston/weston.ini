[core]
idle-time=0
require-input=false

[output]
name=DP-1
mode=1920x1080@60
# il piano grafica del kernel xlnx 2023.2 non supporta XR24 (default di
# Weston): senza questa riga i commit atomici falliscono con EINVAL e lo
# schermo resta nero. ARGB e' anche il formato giusto per il punch-through
# (alpha per-pixel sopra il piano video).
gbm-format=argb8888

[shell]
# Dispositivo a applicazione singola: niente pannello (la barra in alto della
# desktop-shell) e niente blocco schermo; sfondo nero dietro l'app.
# Data/ora e stato rete sono mostrati dall'app (riga in fondo al pannello).
panel-position=none
locking=false
background-color=0xff000000
animation=none
